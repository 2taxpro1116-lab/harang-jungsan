<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하랑관광 정산내역서 자동 생성</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "맑은 고딕", "Malgun Gothic", sans-serif; margin: 0;
         background: #f4f5f7; color: #222; }
  header { background: #2c3e50; color: #fff; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid #dde1e6; border-radius: 8px;
          margin-bottom: 16px; overflow: hidden; }
  .card > h2 { margin: 0; padding: 10px 14px; background: #eef1f5; font-size: 14px;
               border-bottom: 1px solid #dde1e6; }
  .card .body { padding: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  label.fld { font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
  input, select, textarea { font-family: inherit; font-size: 13px; padding: 5px 7px;
          border: 1px solid #c4c9d0; border-radius: 5px; }
  input[type=number] { text-align: right; }
  button { font-family: inherit; font-size: 13px; padding: 7px 14px; border: 0;
           border-radius: 6px; cursor: pointer; background: #3498db; color: #fff; }
  button.sec { background: #7f8c8d; }
  button.danger { background: #e74c3c; padding: 3px 8px; font-size: 12px; }
  button.mini { background: #27ae60; padding: 4px 10px; font-size: 12px; }
  button:hover { opacity: .9; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #d6dade; padding: 4px 6px; }
  th { background: #f0f3f6; }
  td input, td select { width: 100%; border: 1px solid #e2e6ea; }
  .members-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .mtab { padding: 6px 12px; background: #e9edf1; border-radius: 6px; cursor: pointer;
          font-size: 13px; border: 1px solid #d6dade; }
  .mtab.active { background: #3498db; color: #fff; border-color: #3498db; }
  .muted { color: #7f8c8d; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #ecf0f1; }
  .pill.warn { background: #fdecea; color: #c0392b; }
  .pill.ok { background: #e8f8f0; color: #1e8449; }

  /* ── 정산내역서 출력 영역 ───────────────────────────── */
  #output { background: #fff; }
  .statement { width: 190mm; margin: 0 auto 10mm; padding: 4mm;
               border: 1px solid #999; }
  .statement table { table-layout: fixed; }
  .statement td, .statement th { border: 1px solid #000; padding: 3px 5px;
               font-size: 12px; vertical-align: middle; }
  .st-title { font-size: 26px; font-weight: bold; text-align: center;
              letter-spacing: 8px; }
  .st-head th { background: #d9d9d9; text-align: center; }
  .gray { background: #d9d9d9; font-weight: bold; text-align: center; }
  .blue { color: #0070c0; font-weight: bold; }
  .orange { background: #fce4d6; }
  .r { text-align: right; } .c { text-align: center; } .l { text-align: left; }
  .small { font-size: 10px; }
  .bigo-box { white-space: pre-line; font-size: 11px; text-align: left;
              vertical-align: top; }

  @media print {
    body { background: #fff; }
    header, .wrap > .card, #printHint { display: none !important; }
    #output, .wrap { margin: 0; padding: 0; max-width: none; }
    .statement { border: none; page-break-after: always; margin: 0 auto; }
    .statement:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>하랑관광 정산내역서 자동 생성</h1>
  <div class="sub">급여대장 업로드 → 조합원별 정산내역서 자동 생성 · 인쇄/PDF</div>
</header>

<div class="wrap">

  <!-- 설정 + 급여대장 -->
  <div class="card">
    <h2>① 기본 설정 &amp; 급여대장</h2>
    <div class="body">
      <div class="row" style="margin-bottom:10px">
        <label class="fld">해당월
          <input id="setMonth" type="text" value="2026년 2월" size="12">
        </label>
        <label class="fld">정산일
          <input id="setDate" type="text" value="2026-03-05" size="12">
        </label>
      </div>
      <div class="row">
        <label class="fld">급여대장 파일 (.xls / .xlsx)
          <input id="payrollFile" type="file" accept=".xls,.xlsx">
        </label>
        <span id="payrollStatus" class="pill">미업로드</span>
      </div>
      <div id="payrollList" class="muted" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- 조합원 관리 -->
  <div class="card">
    <h2>② 조합원 정보 &amp; 내역 입력</h2>
    <div class="body">
      <div class="row" style="margin-bottom:10px; padding:8px; background:#f0f7ff; border-radius:6px">
        <label class="fld">📂 정산입력 엑셀 불러오기 (내역입력/조합원정보/설정 시트)
          <input id="inputFile" type="file" accept=".xlsx,.xls">
        </label>
        <span id="inputStatus" class="pill">선택 시 조합원·내역 자동 채움</span>
        <button class="mini" onclick="downloadTemplate()" style="align-self:flex-end">📥 빈 템플릿(엑셀) 받기</button>
      </div>
      <div class="members-tabs" id="memberTabs"></div>
      <div class="toolbar" style="margin-bottom:12px">
        <button class="mini" onclick="addMember()">+ 조합원 추가</button>
        <button class="sec" onclick="delMember()">현재 조합원 삭제</button>
        <span class="muted">탭을 눌러 조합원을 전환하세요. 입력은 자동 저장됩니다.</span>
      </div>

      <div id="memberEditor"></div>
    </div>
  </div>

  <!-- 생성 -->
  <div class="card">
    <h2>③ 정산내역서 생성</h2>
    <div class="body toolbar">
      <button onclick="generate()">▶ 정산내역서 생성</button>
      <button class="sec" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
      <button class="sec" onclick="exportData()">데이터 백업(JSON)</button>
      <label class="fld" style="flex-direction:row;align-items:center;gap:6px">
        <span class="muted">복원</span>
        <input id="importFile" type="file" accept=".json" onchange="importData(event)">
      </label>
    </div>
  </div>

  <div id="printHint" class="muted" style="margin:6px 2px">
    ※ 인쇄 미리보기에서 "대상: PDF로 저장"을 선택하면 PDF 파일로 저장됩니다.
  </div>

  <div id="output"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
//  상태
// ══════════════════════════════════════════════════════════════════════
let state = {
  month: "2026년 2월",
  date: "2026-03-05",
  members: [],     // {name, car, account, note, items:[{gubun,dest,month,income,expense,bigo}]}
  current: 0,
};
let payrollMap = {};   // {이름: 급여}

const won = n => (isNaN(n) ? "" : Math.round(n).toLocaleString("ko-KR"));
const num = v => { const n = parseFloat(String(v).replace(/,/g,"")); return isNaN(n)?0:n; };

// ── 저장/복원 ──────────────────────────────────────────────────────────
function save() {
  state.month = document.getElementById("setMonth").value;
  state.date  = document.getElementById("setDate").value;
  localStorage.setItem("harang_state", JSON.stringify(state));
}
function load() {
  const s = localStorage.getItem("harang_state");
  if (s) { try { state = JSON.parse(s); } catch(e){} }
  if (!state.members.length) {
    state.members = [ blankMember("") ];
  }
  document.getElementById("setMonth").value = state.month || "";
  document.getElementById("setDate").value  = state.date  || "";
}
function blankMember(name) {
  return { name: name||"", car:"", account:"", note:"", tax:"",
           items: [ blankItem() ] };
}
function blankItem() {
  return { date:"", gubun:"", paid:"", dest:"", contractor:"",
           income:"", expense:"", cashTax:"", reserve:"", normalRun:"", bigo:"" };
}

// ══════════════════════════════════════════════════════════════════════
//  급여대장 파싱
// ══════════════════════════════════════════════════════════════════════
document.getElementById("payrollFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const wb = XLSX.read(new Uint8Array(ev.target.result), { type:"array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1 });
    payrollMap = {};
    rows.forEach(r => {
      if (!r || r[0]==null) return;
      let name = String(r[0]).split("\n")[0].trim();
      const pay = r[14];   // O열 = index 14 (지급액계)
      if (name && typeof pay === "number" && pay > 0 && !/^\d+\.?$/.test(name)) {
        payrollMap[name] = pay;
      }
    });
    const cnt = Object.keys(payrollMap).length;
    document.getElementById("payrollStatus").className = "pill ok";
    document.getElementById("payrollStatus").textContent = `${cnt}명 로드됨`;
    document.getElementById("payrollList").textContent =
      "급여 연동: " + Object.entries(payrollMap)
        .map(([k,v])=>`${k} ${won(v)}`).join(" · ");
    renderEditor();
  };
  reader.readAsArrayBuffer(f);
});

// ══════════════════════════════════════════════════════════════════════
//  정산입력 엑셀 파싱 (내역입력/조합원정보/설정)
// ══════════════════════════════════════════════════════════════════════
function findSheet(wb, keyword) {
  const nm = wb.SheetNames.find(n => n.replace(/\s/g,"").includes(keyword));
  return nm ? wb.Sheets[nm] : null;
}
document.getElementById("inputFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let wb;
    try { wb = XLSX.read(new Uint8Array(ev.target.result), { type:"array" }); }
    catch(err){ alert("엑셀을 읽을 수 없습니다: "+err); return; }

    // 내역입력
    const wsItem = findSheet(wb, "내역입력");
    if (!wsItem) { alert("'내역입력' 시트를 찾을 수 없습니다."); return; }
    const itemRows = XLSX.utils.sheet_to_json(wsItem, { header:1 });

    const byName = {}, order = [];
    itemRows.slice(1).forEach(r => {   // 1행 헤더 제외
      if (!r || r[0]==null) return;
      const name = String(r[0]).trim();
      if (!name || name.startsWith("※")) return;
      if (!byName[name]) { byName[name] = []; order.push(name); }
      const cell = v => (v!=null ? String(v).trim() : "");
      const numc = v => (v!=null && v!=="" ? v : "");
      const dcell = v => {
        // 엑셀 날짜 일련번호(숫자) → YYYY-MM-DD (시간대 영향 없이 UTC 계산)
        if (typeof v === "number") {
          const utc = Date.UTC(1899,11,30) + Math.round(v)*86400000;
          const d = new Date(utc);
          const y=d.getUTCFullYear(), mo=String(d.getUTCMonth()+1).padStart(2,"0"),
                dd=String(d.getUTCDate()).padStart(2,"0");
          return `${y}-${mo}-${dd}`;
        }
        return cell(v);
      };
      byName[name].push({
        date:      dcell(r[1]),
        gubun:     cell(r[2]),
        paid:      cell(r[3]),
        dest:      cell(r[4]),
        contractor:cell(r[5]),
        income:    numc(r[6]),
        expense:   numc(r[7]),
        cashTax:   numc(r[8]),
        reserve:   numc(r[9]),
        normalRun: numc(r[10]),
        bigo:      cell(r[11]),
      });
    });

    // 조합원정보: 조합원명|차량번호|입금계좌|잔여금소득세|분할분담금안내
    const info = {};
    const wsInfo = findSheet(wb, "조합원정보");
    if (wsInfo) {
      XLSX.utils.sheet_to_json(wsInfo, { header:1 }).slice(1).forEach(r => {
        if (!r || r[0]==null) return;
        const name = String(r[0]).trim();
        if (!name) return;
        info[name] = {
          car: r[1]!=null?String(r[1]).trim():"",
          account: r[2]!=null?String(r[2]).trim():"",
          tax: r[3]!=null && r[3]!=="" ? r[3] : "",
          note: r[4]!=null?String(r[4]):"",
        };
      });
    }

    // 설정
    const wsSet = findSheet(wb, "설정");
    if (wsSet) {
      XLSX.utils.sheet_to_json(wsSet, { header:1 }).slice(1).forEach(r => {
        if (!r || r[0]==null) return;
        const k = String(r[0]).trim(), v = r[1]!=null?String(r[1]).trim():"";
        if (k.includes("해당월") && v) state.month = v;
        if (k.includes("정산일") && v) state.date = v;
      });
    }

    if (!order.length) { alert("'내역입력' 시트에 조합원 데이터가 없습니다."); return; }

    // state 재구성
    state.members = order.map(name => ({
      name,
      car: (info[name]||{}).car || "",
      account: (info[name]||{}).account || "",
      tax: (info[name]||{}).tax || "",
      note: (info[name]||{}).note || "",
      items: byName[name].length ? byName[name] : [ blankItem() ],
    }));
    state.current = 0;
    document.getElementById("setMonth").value = state.month;
    document.getElementById("setDate").value = state.date;
    save();

    const st = document.getElementById("inputStatus");
    st.className = "pill ok";
    st.textContent = `${order.length}명 불러옴`;
    renderTabs(); renderEditor();
  };
  reader.readAsArrayBuffer(f);
});

// ══════════════════════════════════════════════════════════════════════
//  조합원 탭 / 에디터
// ══════════════════════════════════════════════════════════════════════
function renderTabs() {
  const box = document.getElementById("memberTabs");
  box.innerHTML = "";
  state.members.forEach((m, i) => {
    const d = document.createElement("div");
    d.className = "mtab" + (i===state.current ? " active":"");
    d.textContent = m.name || `(이름없음 ${i+1})`;
    d.onclick = () => { state.current = i; renderTabs(); renderEditor(); };
    box.appendChild(d);
  });
}
function addMember() { state.members.push(blankMember("")); state.current = state.members.length-1; save(); renderTabs(); renderEditor(); }
function delMember() {
  if (state.members.length<=1) { alert("최소 1명은 있어야 합니다."); return; }
  if (!confirm("현재 조합원을 삭제할까요?")) return;
  state.members.splice(state.current,1);
  state.current = Math.max(0, state.current-1);
  save(); renderTabs(); renderEditor();
}

function renderEditor() {
  const m = state.members[state.current];
  if (!m) return;
  const pay = payrollMap[m.name];
  const payPill = m.name
    ? (pay!=null ? `<span class="pill ok">급여 ${won(pay)}원</span>`
                 : `<span class="pill warn">급여대장에 '${m.name}' 없음</span>`)
    : `<span class="pill">이름 입력 시 급여 자동연동</span>`;

  let itemRows = m.items.map((it,idx)=>`
    <tr>
      <td class="c">${idx+1}</td>
      <td><input value="${esc(it.date)}" onchange="upd(${idx},'date',this.value)" placeholder="2026-02-01"></td>
      <td><input value="${esc(it.gubun)}" onchange="upd(${idx},'gubun',this.value)"></td>
      <td><input value="${esc(it.paid)}" onchange="upd(${idx},'paid',this.value)"></td>
      <td><input value="${esc(it.dest)}" onchange="upd(${idx},'dest',this.value)"></td>
      <td><input value="${esc(it.contractor)}" onchange="upd(${idx},'contractor',this.value)"></td>
      <td><input type="number" value="${it.income}" onchange="upd(${idx},'income',this.value)"></td>
      <td><input type="number" value="${it.expense}" onchange="upd(${idx},'expense',this.value)"></td>
      <td><input type="number" value="${it.cashTax}" onchange="upd(${idx},'cashTax',this.value)"></td>
      <td><input type="number" value="${it.reserve}" onchange="upd(${idx},'reserve',this.value)"></td>
      <td><input type="number" value="${it.normalRun}" onchange="upd(${idx},'normalRun',this.value)"></td>
      <td><input value="${esc(it.bigo)}" onchange="upd(${idx},'bigo',this.value)"></td>
      <td class="c"><button class="danger" onclick="delItem(${idx})">×</button></td>
    </tr>`).join("");

  document.getElementById("memberEditor").innerHTML = `
    <div class="row" style="margin-bottom:10px">
      <label class="fld">조합원명 ${payPill}
        <input value="${esc(m.name)}" onchange="updM('name',this.value)">
      </label>
      <label class="fld">차량번호
        <input value="${esc(m.car)}" onchange="updM('car',this.value)">
      </label>
      <label class="fld">잔여금 소득세
        <span style="display:flex;gap:4px;align-items:center">
          <input type="number" value="${m.tax||''}" onchange="updM('tax',this.value)" placeholder="0" style="width:88px">
          <button class="mini" onclick="autoTax()" title="잔여금 × 3.3% 자동계산">3.3%</button>
        </span>
      </label>
      <label class="fld" style="flex:1">입금계좌
        <input style="width:100%" value="${esc(m.account)}" onchange="updM('account',this.value)">
      </label>
    </div>
    <label class="fld" style="margin-bottom:10px">분할분담금 안내(비고)
      <textarea rows="3" style="width:100%" onchange="updM('note',this.value)">${esc(m.note)}</textarea>
    </label>
    <div style="overflow-x:auto">
    <table style="min-width:1050px">
      <thead><tr>
        <th style="width:30px">No</th><th style="width:92px">일자</th>
        <th style="width:60px">구분</th><th style="width:60px">입금일</th>
        <th style="width:130px">행선지</th><th style="width:100px">계약자</th>
        <th style="width:100px">수입(입금)</th><th style="width:100px">지출(출금)</th>
        <th style="width:90px">현금매출세액</th><th style="width:90px">보류</th>
        <th style="width:90px">일반운행</th><th>비고</th><th style="width:30px"></th>
      </tr></thead>
      <tbody>${itemRows}</tbody>
    </table>
    </div>
    <div style="margin-top:8px"><button class="mini" onclick="addItem()">+ 내역 줄 추가</button></div>
  `;
}
function esc(s){ return String(s==null?"":s).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function updM(k,v){ state.members[state.current][k]=v; save(); if(k==="name"){renderTabs(); renderEditor();} }
function upd(i,k,v){ state.members[state.current].items[i][k]=v; save(); }
function autoTax(){
  const m = state.members[state.current];
  const it = m.items;
  const inc = it.reduce((s,x)=>s+num(x.income),0);
  const exp = it.reduce((s,x)=>s+num(x.expense),0);
  const ct  = it.reduce((s,x)=>s+num(x.cashTax),0);
  const total = inc - (exp + ct);
  const remain = total - (payrollMap[m.name]||0);
  m.tax = Math.round(remain * 0.033);
  save(); renderEditor();
}
function addItem(){ state.members[state.current].items.push(blankItem()); save(); renderEditor(); }
function delItem(i){ const it=state.members[state.current].items; if(it.length<=1){it[0]=blankItem();} else {it.splice(i,1);} save(); renderEditor(); }

// ══════════════════════════════════════════════════════════════════════
//  정산내역서 생성 (표준 양식)
// ══════════════════════════════════════════════════════════════════════
function generate() {
  save();
  const out = document.getElementById("output");
  out.innerHTML = "";
  state.members.forEach(m => out.appendChild(renderStatement(m)));
  out.scrollIntoView({behavior:"smooth"});
}

function renderStatement(m) {
  const items = m.items.filter(it =>
    it.date||it.gubun||it.dest||it.contractor||it.income||it.expense||
    it.cashTax||it.reserve||it.normalRun||it.bigo);

  const incomeSum    = items.reduce((s,it)=>s+num(it.income),0);
  const expenseSum   = items.reduce((s,it)=>s+num(it.expense),0);
  const cashTaxSum   = items.reduce((s,it)=>s+num(it.cashTax),0);
  const reserveSum   = items.reduce((s,it)=>s+num(it.reserve),0);
  const normalRunSum = items.reduce((s,it)=>s+num(it.normalRun),0);

  const total       = incomeSum - (expenseSum + cashTaxSum); // 전체(급여)
  const reserveAmt  = reserveSum / 1.1;                       // 보류금액
  const normalVat   = normalRunSum / 11;                      // 일반운행 부가세
  const salary      = payrollMap[m.name] || 0;               // 급여
  const remain      = total - salary;                        // 잔여금
  const taxManual   = num(m.tax);                            // 잔여금 소득세(수동)
  const remainSum   = Math.round((remain - taxManual - normalVat)/10)*10; // ROUND(,-1)

  const minRows = Math.max(items.length, 8);
  let rows = "";
  for (let i=0;i<minRows;i++){
    const it = items[i] || {};
    const g = v => (num(v) ? won(num(v)) : "");
    rows += `<tr>
      <td class="c small">${esc(it.date)}</td>
      <td class="c">${esc(it.gubun)}</td>
      <td class="c">${esc(it.paid)}</td>
      <td class="l">${esc(it.dest)}</td>
      <td class="l">${esc(it.contractor)}</td>
      <td class="r">${g(it.income)}</td>
      <td class="r">${g(it.expense)}</td>
      <td class="r">${g(it.cashTax)}</td>
      <td class="r">${g(it.reserve)}</td>
      <td class="r">${g(it.normalRun)}</td>
    </tr>`;
  }

  const div = document.createElement("div");
  div.className = "statement";
  div.innerHTML = `
  <table>
    <colgroup>
      <col style="width:9%"><col style="width:6%"><col style="width:6%">
      <col style="width:14%"><col style="width:10%"><col style="width:11%">
      <col style="width:11%"><col style="width:9%"><col style="width:12%">
      <col style="width:12%">
    </colgroup>
    <tr>
      <td class="st-title" colspan="4" rowspan="2">정산내역서</td>
      <td class="gray">차량번호</td><td class="c blue" colspan="2">${esc(m.car)}</td>
      <td class="gray">해당월</td><td class="c blue" colspan="2">${esc(state.month)}</td>
    </tr>
    <tr>
      <td class="gray">조합원명</td><td class="c blue" colspan="2">${esc(m.name)}</td>
      <td class="gray">정산일</td><td class="c blue" colspan="2">${esc(state.date)}</td>
    </tr>
    <tr class="st-head">
      <th>일자</th><th>구분</th><th>입금일</th><th colspan="2">행선지 / 계약자</th>
      <th>수입(입금)</th><th>지출(출금)</th><th>현금매출<br>세액</th>
      <th>보류</th><th>일반운행</th>
    </tr>
    ${rows}
    <tr>
      <td class="gray" colspan="5">계</td>
      <td class="r blue">${won(incomeSum)}</td>
      <td class="r" style="font-weight:bold">${won(expenseSum)}</td>
      <td class="r">${cashTaxSum?won(cashTaxSum):"–"}</td>
      <td class="r" style="color:#1e8449">${won(reserveSum)}</td>
      <td></td>
    </tr>
    <!-- 총계 영역 -->
    <tr>
      <td class="gray" colspan="4" rowspan="4">총   계</td>
      <td class="gray">전체(급여)</td>
      <td class="r" colspan="3" style="font-weight:bold">${won(total)}</td>
      <td class="gray" style="background:#fff2cc">보류금액</td>
      <td class="gray">일반운행</td>
    </tr>
    <tr>
      <td class="gray" colspan="4"></td>
      <td class="r" style="color:#1e8449">${won(reserveAmt)}</td>
      <td class="r">${won(normalRunSum)}</td>
    </tr>
    <tr>
      <td class="gray">잔여금</td>
      <td class="r" style="font-weight:bold">${won(remain)}</td>
      <td class="gray">잔여금 소득세</td>
      <td class="r" style="background:#e2efda">${taxManual?won(taxManual):""}</td>
      <td class="gray">일반운행<br>부가세</td>
      <td class="r">${won(normalVat)}</td>
    </tr>
    <tr>
      <td class="gray orange">급   여</td>
      <td class="r orange" colspan="2" style="font-weight:bold">${salary?won(salary):"–"}</td>
      <td class="gray">잔여합계</td>
      <td class="r orange" colspan="2" style="font-weight:bold;font-size:14px">${won(remainSum)}</td>
    </tr>
    <!-- 비고 / 추가내용 -->
    <tr>
      <td class="gray">비 고</td>
      <td class="bigo-box" colspan="3">${esc(m.note)}</td>
      <td class="gray">추가내용</td>
      <td class="c" colspan="5" style="font-weight:bold">${esc(m.account)}</td>
    </tr>
  </table>`;
  return div;
}

// ── 백업/복원 ──────────────────────────────────────────────────────────
function exportData() {
  save();
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `정산데이터_${(state.month||"").replace(/\s/g,"")}.json`;
  a.click();
}
function importData(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try { state = JSON.parse(ev.target.result); state.current=0;
          save(); load(); renderTabs(); renderEditor();
          alert("복원되었습니다."); }
    catch(err){ alert("복원 실패: "+err); }
  };
  r.readAsText(f);
}

// ── 시작 ───────────────────────────────────────────────────────────────
document.getElementById("setMonth").addEventListener("change", save);
document.getElementById("setDate").addEventListener("change", save);
load(); renderTabs(); renderEditor();
</script>
